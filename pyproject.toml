[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listedjob-backend"
version = "0.1.0"
description = "Backend for listedjob.io"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.110,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
