services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: listedjob
      POSTGRES_USER: listedjob
      POSTGRES_PASSWORD: listedjob
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listedjob -d listedjob"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
